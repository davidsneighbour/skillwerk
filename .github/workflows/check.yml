name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run check
  collections:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: [apparatus, clerkwork, fettle, gallimaufry, gazetteer, idiolect, patternbook, posthaste]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run package -- --collection ${{ matrix.collection }}
      - run: npm run test:archive -- --collection ${{ matrix.collection }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.collection }}
          path: dist/${{ matrix.collection }}.tar.gz
