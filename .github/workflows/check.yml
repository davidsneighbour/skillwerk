name: Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run check
  collections:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        collection: [apparatus, clerkwork, fettle, gallimaufry, gazetteer, idiolect, patternbook, posthaste]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm run package -- --collection ${{ matrix.collection }}
      - run: npm run test:archive -- --collection ${{ matrix.collection }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.collection }}
          path: dist/${{ matrix.collection }}.tar.gz
