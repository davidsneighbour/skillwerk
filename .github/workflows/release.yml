name: Release collection
on:
  push:
    tags: ["*/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - id: collection
        run: |
          echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*/}" >> "$GITHUB_OUTPUT"
      - run: npm run check -- --collection ${{ steps.collection.outputs.name }}
      - run: npm run package -- --collection ${{ steps.collection.outputs.name }}
      - run: npm run test:archive -- --collection ${{ steps.collection.outputs.name }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ steps.collection.outputs.name }} ${{ steps.collection.outputs.version }}
          files: dist/${{ steps.collection.outputs.name }}.tar.gz
