name: Release collection
on:
  push:
    tags: ["*/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - id: collection
        run: |
          echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*/}" >> "$GITHUB_OUTPUT"
      - run: npm run check -- --collection ${{ steps.collection.outputs.name }}
      - run: npm run package -- --collection ${{ steps.collection.outputs.name }}
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.collection.outputs.name }} ${{ steps.collection.outputs.version }}
          generate_release_notes: true
          files: dist/${{ steps.collection.outputs.name }}.tar.gz
