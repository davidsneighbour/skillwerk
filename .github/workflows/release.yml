name: Release collection
on:
  push:
    tags: ["*/v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - id: collection
        run: |
          echo "name=${GITHUB_REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#*/}" >> "$GITHUB_OUTPUT"
      - run: npm run check -- --collection ${{ steps.collection.outputs.name }}
      - run: npm run package -- --collection ${{ steps.collection.outputs.name }}
      - run: npm run test:archive -- --collection ${{ steps.collection.outputs.name }}
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ steps.collection.outputs.name }} ${{ steps.collection.outputs.version }}
          files: dist/${{ steps.collection.outputs.name }}.tar.gz
